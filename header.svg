
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101B18">
        <animate attributeName="stop-color" values="#101B18;#183B32;#101B18" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#183B32">
        <animate attributeName="stop-color" values="#183B32;#244D40;#183B32" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#244D40"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8FCBB0" stop-opacity="0"/>
      <stop offset="50%" stop-color="#A8DCC2"/>
      <stop offset="100%" stop-color="#8FCBB0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#A8DCC2" stop-opacity=".24"/>
      <stop offset="100%" stop-color="#A8DCC2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>

  <!-- Ambient glow -->
  <circle cx="1020" cy="65" r="150" fill="url(#glow)">
    <animate attributeName="r" values="125;175;125" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="250" r="145" fill="url(#glow)">
    <animate attributeName="r" values="110;155;110" dur="11s" repeatCount="indefinite"/>
  </circle>

  <!-- Floating particles -->
  <g fill="#A8DCC2">
    <circle cx="170" cy="65" r="2">
      <animate attributeName="cy" values="65;45;65" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".2;.9;.2" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1020" cy="190" r="2.5">
      <animate attributeName="cy" values="190;168;190" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".2;.8;.2" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="55" r="2">
      <animate attributeName="cy" values="55;75;55" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="280" cy="220" r="2">
      <animate attributeName="cy" values="220;200;220" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="750" cy="240" r="1.8">
      <animate attributeName="cy" values="240;218;240" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="560" cy="45" r="1.5">
      <animate attributeName="opacity" values=".15;.8;.15" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Animated waves -->
  <path d="M0 245 Q300 185 600 240 T1200 230"
        fill="none" stroke="#A8DCC2" stroke-opacity=".18" stroke-width="2">
    <animate attributeName="d"
      values="M0 245 Q300 185 600 240 T1200 230;M0 230 Q300 270 600 215 T1200 245;M0 245 Q300 185 600 240 T1200 230"
      dur="12s" repeatCount="indefinite"/>
  </path>
  <path d="M0 265 Q300 205 600 260 T1200 250"
        fill="none" stroke="#A8DCC2" stroke-opacity=".09" stroke-width="2">
    <animate attributeName="d"
      values="M0 265 Q300 205 600 260 T1200 250;M0 250 Q300 285 600 240 T1200 265;M0 265 Q300 205 600 260 T1200 250"
      dur="14s" repeatCount="indefinite"/>
  </path>

  <!-- Name -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="1.5s" fill="freeze"/>
    <text x="600" y="105" text-anchor="middle"
          fill="#F4F4E9" font-family="Arial, sans-serif"
          font-size="52" font-weight="700" letter-spacing="4">
      PRAYUSH SHRESTHA
    </text>
  </g>

  <!-- Animated divider -->
  <rect x="390" y="135" width="420" height="2" fill="url(#line)">
    <animate attributeName="opacity" values=".3;1;.3" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Main identity -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin=".5s" dur="1.5s" fill="freeze"/>
    <text x="600" y="177" text-anchor="middle"
          fill="#A8DCC2" font-family="Arial, sans-serif"
          font-size="19" font-weight="600" letter-spacing="5">
      SOFTWARE DEVELOPER
    </text>
  </g>

  <!-- Specialization -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1s" dur="1.5s" fill="freeze"/>
    <text x="600" y="215" text-anchor="middle"
          fill="#F4F4E9" font-family="Arial, sans-serif"
          font-size="15" letter-spacing="2.2">
      AI/ML · DATA ANALYTICS · DATA ENGINEERING · CLOUD
    </text>
  </g>

  <!-- Small location label -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to=".7" begin="1.5s" dur="1.5s" fill="freeze"/>
    <text x="600" y="246" text-anchor="middle"
          fill="#A8DCC2" font-family="Arial, sans-serif"
          font-size="11" letter-spacing="4">
      KATHMANDU, NEPAL
    </text>
  </g>

  <!-- Moving light sweep -->
  <rect x="-180" y="0" width="100" height="300" fill="#A8DCC2" opacity=".035">
    <animate attributeName="x" values="-180;1280" dur="14s" repeatCount="indefinite"/>
  </rect>
</svg>
